name: P3G offline verification
on:
  push:
    paths:
      - 'gke/app/peer.py'
      - 'gke/app/peer.proto'
      - 'gke/app/qahbn2_runtime.py'
      - 'gke/app/controller_shared.py'
      - 'gke/app/k7_controller.py'
      - 'gke/app/recovery_availability.py'
      - 'gke/app/Dockerfile.qahbn2'
      - 'tests/test_p3g_recovery.py'
      - 'tests/test_p3g_peerstate_integration.py'
      - 'tests/test_p3g_v3_notification.py'
      - 'tests/test_p3g_cap3_launcher.py'
      - 'gke/scripts/run_k7_experiment.sh'
      - 'gke/helm/ahbn/values.yaml'
      - 'gke/helm/ahbn/templates/statefulset.yaml'
      - '.github/workflows/p3g-offline.yml'
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install -r gke/app/requirements.txt
      - name: Generate gRPC message bindings
        run: python -m grpc_tools.protoc -I gke/app --python_out=gke/app --grpc_python_out=gke/app gke/app/peer.proto
      - name: Record exact commit and source SHA256
        run: |
          git rev-parse HEAD
          sha256sum gke/app/peer.py gke/app/peer.proto gke/app/recovery_availability.py gke/app/qahbn2_runtime.py gke/app/controller_shared.py gke/app/k7_controller.py tests/test_p3g_recovery.py tests/test_p3g_peerstate_integration.py tests/test_p3g_v3_notification.py
      - name: Verify Python syntax
        run: python -m compileall -q gke/app tests/test_p3g_recovery.py tests/test_p3g_peerstate_integration.py tests/test_p3g_v3_notification.py
      - name: Run P3G T01–T18 and PeerState integration
        run: PYTHONPATH=gke/app python -m unittest tests.test_p3g_recovery tests.test_p3g_peerstate_integration tests.test_p3g_v3_notification -v
      - name: P3G CAP3 launcher offline contract and negative guards
        run: |
          bash -n gke/scripts/run_k7_experiment.sh
          python -m unittest tests.test_p3g_cap3_launcher -v
      - name: Frozen AHBN and Q-AHBN2 regression parity
        run: PYTHONPATH=gke/app python -m unittest tests.test_k2_kubernetes_adapter tests.test_transition_bookkeeping tests.test_learning_schedule tests.test_s03_2a_trace_provenance tests.test_controlsim_event_bridge -v
